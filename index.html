<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2048 Game — Java</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #faf8ef;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        h1 { color: #776e65; margin: 10px 0; }
        #status { color: #776e65; font-size: 16px; padding: 20px; }
        #display-container {
            margin-top: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 8px;
            overflow: hidden;
            background: white;
        }
        .credit {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
        .credit a { color: #776e65; }
    </style>
</head>
<body>
    <h1>2048 — Java Edition</h1>
    <p id="status">Loading CheerpJ runtime...</p>
    <div id="display-container"></div>
    <div class="credit">Powered by <a href="https://cheerpj.com" target="_blank">CheerpJ</a></div>

    <!-- CheerpJ 3.0 loader -->
    <script src="https://cjrtnc.leaningtech.com/3.0/cj3loader.js"></script>
    <script>
        (async function () {
            try {
                document.getElementById("status").innerText = "Initializing Java...";
                await cheerpjInit();

                document.getElementById("status").innerText = "Loading game...";
                const container = document.getElementById("display-container");
                await cheerpjCreateDisplay(500, 600, container);

                document.getElementById("status").innerText = "Starting 2048...";
                await cheerpjRunJar("/java/src/2048-game.jar");

                document.getElementById("status").style.display = "none";
            } catch (err) {
                document.getElementById("status").innerText = "Error: " + err.message;
                console.error("CheerpJ error:", err);
            }
        })();
    </script>
</body>
</html>
