<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2048 Game — Java</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #faf8ef;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        h1 { color: #776e65; margin: 10px 0; }
        #loading { color: #776e65; font-size: 18px; padding: 40px; }
        #display-container {
            margin-top: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 8px;
            overflow: hidden;
            background: white;
        }
        .credit {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
        .credit a { color: #776e65; }
    </style>
</head>
<body>
    <h1>2048 — Java Edition</h1>
    <p id="loading">Loading game... (first load takes ~15 seconds)</p>
    <div id="display-container"></div>
    <div class="credit">Powered by <a href="https://cheerpj.com" target="_blank">CheerpJ</a></div>

    <script src="https://cjrtnc.leaningtech.com/4.0/loader.js"></script>
    <script>
        (async function () {
            await cheerpjInit({ version: 17 });
            document.getElementById('loading').style.display = 'none';
            const container = document.getElementById('display-container');
            cheerpjCreateDisplay(500, 600, container);
            await cheerpjRunJar("/java/src/2048-game.jar");
        })();
    </script>
</body>
</html>
